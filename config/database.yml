default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  url: <%= ENV['DATABASE_URL'] %>

development:
  <<: *default
  url: <%= ENV.fetch('DATABASE_URL', 'postgresql://postgres:password@localhost:5432/daniel15k_development') %>

test:
  <<: *default
  url: <%= ENV.fetch('DATABASE_URL_TEST', 'postgresql://postgres:password@localhost:5432/daniel15k_test') %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
